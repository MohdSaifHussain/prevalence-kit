# The gate. Everything the director runs by hand, run on every push.
#
# Both ruff halves, deliberately: `ruff check` passes badly formatted code by
# design and `ruff format --check` passes lint errors by design, so one of them
# green says nothing about the other. A gate half-run is a gate not run.
#
# Actions are SHA-pinned, not tag-pinned. A tag is a mutable pointer and this
# project's supply-chain bar (charter 5.1) does not accept one.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CI proves the floor; development happens on the current line. D-10.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy --strict
        run: mypy --strict src

      - name: pytest
        run: pytest -q

      - name: Determinism across versions
        # R2: the same plan and seed must draw a byte-identical sample on every
        # supported Python. Printed so a mismatch is visible in the log rather
        # than only in an assertion.
        run: |
          python - <<'PY'
          from prevalence_kit.sampling import draw_srs
          frame = [f"item-{i:04d}" for i in range(200)]
          drawn = draw_srs(frame, seed="phase-1-fixture-seed", n=5)
          print("draw:", drawn)
          assert drawn == ("item-0129", "item-0089", "item-0169", "item-0027", "item-0008")
          PY

  record:
    # The record has to reconcile against the code, not against the last report.
    # This is the machine for the class of defect that a passing test suite
    # cannot see: docs/CORRECTIONS.md C-12.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]"

      - name: check_claims selftest
        # Selftest first. A checker that has only ever passed is a decoration.
        run: python tools/check_claims.py --selftest

      - name: check_claims
        run: python tools/check_claims.py

      - name: tripwire baselines
        # Offline by default. The live check is a phase-close ritual, not a CI
        # job -- a tripwire firing is a decision for the director, not a red X.
        run: python tools/check_tripwires.py
