# The container image: built on every change to it, published only at a tag.
#
# D3.12 and D3.15. Two different jobs on purpose: an image that only ever gets
# built at release time is an image whose first real build is the irreversible
# act, which is what R3.1 forbids.
#
#   * every push touching the image  -> BUILD it, and RUN the shipped example
#     inside it. A build that succeeds and a tool that runs are different
#     claims (R3.12), and only the second one is worth anything.
#   * a tag                          -> push to ghcr.io with a provenance
#     attestation.
name: container

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "constraints.txt"
      - "pyproject.toml"
      - "src/**"
      - "examples/**"
      - ".github/workflows/container.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "constraints.txt"
      - "src/**"
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and run the example inside it
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: docker build -t prevalence-kit:ci .

      # The image is not verified by building. It is verified by measuring
      # something with it -- the whole chain, ending in `verify`, exactly as
      # docs/SOP.md tells an operator to run it.
      - name: Measure something with it
        run: |
          set -euo pipefail
          EX=/opt/prevalence-kit/examples/synthetic
          run() { docker run --rm -v "$PWD/work:/work" prevalence-kit:ci "$@"; }
          mkdir -p work
          run --version
          run plan          "$EX/plan.yaml"                 --run /work/run
          run sample        "$EX/plan.yaml" "$EX/frame.txt" --run /work/run
          run ingest-labels "$EX/plan.yaml" "$EX/labels.csv" --run /work/run
          run estimate      "$EX/plan.yaml"                 --run /work/run
          run verify --run /work/run --plan "$EX/plan.yaml"
          run emit-report   "$EX/plan.yaml"                 --run /work/run
          test -s work/run/report.md

      # The negative control. A container that can only succeed proves nothing
      # about the refusals, and the refusals are the product. This one must
      # exit 2 with EVIDENCE_NOT_PREREGISTERED: the frame passed is not the
      # frame the plan pre-registers.
      - name: It must also refuse
        run: |
          set -euo pipefail
          EX=/opt/prevalence-kit/examples/synthetic
          set +e
          out=$(docker run --rm -v "$PWD/work:/work" prevalence-kit:ci \
                  sample "$EX/plan.yaml" "$EX/labels.csv" --run /work/run2 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" = "2" || { echo "expected exit 2, got $code"; exit 1; }
          echo "$out" | grep -q EVIDENCE_NOT_PREREGISTERED \
            || { echo "refused, but not for the reason under test"; exit 1; }

      - name: Non-root, and only what it needs
        run: |
          test "$(docker run --rm --entrypoint id -u prevalence-kit:ci)" = "10001"
          docker run --rm --entrypoint python prevalence-kit:ci -c \
            "import importlib.metadata as m; ns={d.metadata['Name'].lower() for d in m.distributions()}; \
             assert not ns & {'pytest','ruff','mypy','hypothesis'}, sorted(ns)"

  publish:
    name: Publish to ghcr.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
